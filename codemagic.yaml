workflows:
  ios-workflow:
    name: CarAI iOS App
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Apple App Store Key
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.carai.mechanicpro"
    scripts:
      - name: Setup Node 22 & Install dependencies
        script: |
          set -e
          if command -v nvm &> /dev/null; then
            nvm install 22 || true
            nvm use 22 || true
          fi
          echo "Active Node Version: $(node -v)"
          npm install --legacy-peer-deps
      - name: Build Web App
        script: |
          set -e
          npm run build
      - name: Sync iOS Native Project
        script: |
          set -e
          npx --yes @capacitor/cli sync ios
      - name: Set dynamic build version
        script: |
          set -e
          cd ios/App
          VERSION_NUM=${BUILD_NUMBER:-1}
          echo "Setting iOS build number to: $VERSION_NUM"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = $VERSION_NUM/g" App.xcodeproj/project.pbxproj 2>/dev/null || sed -i "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = $VERSION_NUM/g" App.xcodeproj/project.pbxproj 2>/dev/null || true
          agvtool new-version -all $VERSION_NUM || true
          cd ../..
      - name: Fetch Apple signing certificates and provisioning profile
        script: |
          set -e
          keychain initialize
          
          echo "Generating standard 2048-bit RSA PEM private key..."
          rm -f /tmp/cert_key /tmp/cert_key.pub
          openssl genrsa -traditional -out /tmp/cert_key 2048 2>/dev/null || openssl genrsa -out /tmp/cert_key 2048
          chmod 600 /tmp/cert_key

          echo "Fetching / Creating Apple App Store distribution files for com.carai.mechanicpro..."
          FETCH_SUCCESS=false

          if app-store-connect fetch-signing-files "com.carai.mechanicpro" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key \
            --create \
            --verbose; then
              FETCH_SUCCESS=true
          elif app-store-connect fetch-signing-files "com.carai.mechanicpro" \
            --platform IOS \
            --type IOS_APP_STORE \
            --create \
            --verbose; then
              FETCH_SUCCESS=true
          elif app-store-connect fetch-signing-files "com.carai.mechanicpro" \
            --platform IOS \
            --type IOS_APP_STORE \
            --verbose; then
              FETCH_SUCCESS=true
          fi

          if [ "$FETCH_SUCCESS" = "false" ]; then
            echo "❌ Signing file fetch failed. Check your Apple Developer account limits."
            exit 1
          fi

          echo "Adding certificates to keychain..."
          keychain add-certificates
          
          echo "Available Code Signing Identities in Keychain:"
          security find-identity -v -p codesigning || true
          
          echo "Applying provisioning profile to project..."
          xcode-project use-profiles --project ios/App/App.xcodeproj || true
          
          # If use-profiles generated an export options plist, adopt it
          if [ -f "/Users/builder/export_options.plist" ]; then
            echo "Adopting /Users/builder/export_options.plist..."
            cp /Users/builder/export_options.plist ios/App/ExportOptions.plist
          elif [ -f "$HOME/export_options.plist" ]; then
            echo "Adopting $HOME/export_options.plist..."
            cp "$HOME/export_options.plist" ios/App/ExportOptions.plist
          fi
      - name: Build iOS Application (App Store Signed IPA)
        script: |
          set -e
          mkdir -p build/ios/ipa

          echo "Resolving Swift Package Dependencies..."
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -skipPackagePluginValidation \
            -skipMacroValidation || true

          EXPORT_PLIST_ARG=""
          if [ -f "/Users/builder/export_options.plist" ]; then
            echo "Using /Users/builder/export_options.plist..."
            EXPORT_PLIST_ARG="--export-options-plist /Users/builder/export_options.plist"
          elif [ -f "$HOME/export_options.plist" ]; then
            echo "Using $HOME/export_options.plist..."
            EXPORT_PLIST_ARG="--export-options-plist $HOME/export_options.plist"
          fi

          echo "Building App Store Signed IPA with Codemagic..."
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --config Release \
            $EXPORT_PLIST_ARG

          echo "Build completed successfully! Exported files:"
          ls -la build/ios/ipa/*.ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
