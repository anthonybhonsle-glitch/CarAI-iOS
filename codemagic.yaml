workflows:
  ios-workflow:
    name: CarAI iOS App
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Apple App Store Key
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Setup Node 22 & Install dependencies
        script: |
          set -e
          if command -v nvm &> /dev/null; then
            nvm install 22 || true
            nvm use 22 || true
          fi
          echo "Active Node Version: $(node -v)"
          npm install --legacy-peer-deps
      - name: Build Web App
        script: |
          set -e
          npm run build
      - name: Sync iOS Native Project
        script: |
          set -e
          npx --yes @capacitor/cli sync ios
      - name: Set dynamic build version
        script: |
          cd ios/App
          agvtool new-version -all ${BUILD_NUMBER:-1} || true
          cd ../..
      - name: Fetch Apple signing certificates and provisioning profile
        script: |
          set -e
          keychain initialize || true
          echo "Fetching Apple App Store distribution files for com.carai.mechanicpro..."
          app-store-connect fetch-signing-files "com.carai.mechanicpro" --type IOS_APP_STORE --create
          xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Build iOS Application (App Store Signed IPA)
        script: |
          set -e
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
