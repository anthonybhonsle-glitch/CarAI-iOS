workflows:
  ios-workflow:
    name: CarAI iOS App
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Setup Node 22 & Install dependencies
        script: |
          if command -v nvm &> /dev/null; then
            nvm install 22 || true
            nvm use 22 || true
          fi
          echo "Active Node Version: $(node -v)"
          npm install --legacy-peer-deps
      - name: Build Web App
        script: |
          npm run build
      - name: Sync iOS Native Project
        script: |
          npx --yes @capacitor/cli sync ios
      - name: Build iOS Application
        script: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App || true
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            archive -archivePath build/App.xcarchive
          mkdir -p build/Payload
          if [ -d "build/App.xcarchive/Products/Applications/App.app" ]; then
            cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
            cd build && zip -r -y App.ipa Payload && cd ..
          fi
    artifacts:
      - ios/App/build/App.ipa
      - ios/App/build/App.xcarchive
      - ios/App/build/**/*.app
      - /tmp/xcodebuild_logs/*.log
