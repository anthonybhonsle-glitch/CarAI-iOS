workflows:
  ios-workflow:
    name: CarAI iOS App
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Apple App Store Key
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.carai.mechanicpro
    scripts:
      - name: Setup Node 22 & Install dependencies
        script: |
          if command -v nvm &> /dev/null; then
            nvm install 22 || true
            nvm use 22 || true
          fi
          echo "Active Node Version: $(node -v)"
          npm install --legacy-peer-deps
      - name: Build Web App
        script: |
          npm run build
      - name: Sync iOS Native Project
        script: |
          npx --yes @capacitor/cli sync ios
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles || true
      - name: Build iOS Application
        script: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App || true
          cd ../..
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/App.xcarchive
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
