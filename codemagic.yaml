workflows:
  ios-workflow:
    name: CarAI iOS App
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Setup Node 22 & Install dependencies
        script: |
          set -e
          if command -v nvm &> /dev/null; then
            nvm install 22 || true
            nvm use 22 || true
          fi
          echo "Active Node Version: $(node -v)"
          npm install --legacy-peer-deps
      - name: Build Web App
        script: |
          set -e
          npm run build
      - name: Sync iOS Native Project
        script: |
          set -e
          npx --yes @capacitor/cli sync ios
      - name: Build iOS Application (Universal Signing & IPA Packaging)
        script: |
          set -e
          echo "Resolving Swift Package Dependencies..."
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App || true
          cd ../..

          SIGNING_SUCCESS=false

          # Check if App Store Connect API keys are present in environment
          if [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ] && [ -n "$APP_STORE_CONNECT_KEY_IDENTIFIER" ] && [ -n "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            echo "App Store Connect API credentials detected in environment variables. Initializing automated signing..."
            keychain initialize || true
            if app-store-connect fetch-signing-files "com.carai.mechanicpro" --type IOS_APP_STORE --create; then
              xcode-project use-profiles || true
              if xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App; then
                SIGNING_SUCCESS=true
                echo "App Store signed IPA successfully generated by xcode-project build-ipa!"
              fi
            else
              echo "App Store signing files could not be fetched automatically. Falling back to release archive build..."
            fi
          fi

          # If signed IPA was not produced above, build clean release archive and package installable IPA
          if [ "$SIGNING_SUCCESS" = false ]; then
            echo "Compiling release build with Xcode..."
            cd ios/App
            xcodebuild archive \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -archivePath build/App.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""

            echo "Packaging App.ipa from compiled archive..."
            rm -rf build/Payload build/App.ipa
            mkdir -p build/Payload
            cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
            cd build
            zip -qr App.ipa Payload
            rm -rf Payload
            echo "Successfully generated App.ipa [$(ls -lh App.ipa | awk '{print $5}')]!"
            cd ../..
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/App.ipa
      - ios/App/build/App.xcarchive
      - /tmp/xcodebuild_logs/*.log
