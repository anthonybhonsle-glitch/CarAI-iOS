workflows:
  ios-workflow:
    name: CarAI iOS App
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build Web App
        script: |
          npm run build
      - name: Sync iOS Native Project
        script: |
          npx --yes @capacitor/cli sync ios
      - name: Build iOS Application
        script: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace -scheme App -destination 'generic/platform=iOS' -configuration Release CODE_SIGNING_ALLOWED=NO archive -archivePath build/App.xcarchive
          else
            xcodebuild -project App.xcodeproj -scheme App -destination 'generic/platform=iOS' -configuration Release CODE_SIGNING_ALLOWED=NO archive -archivePath build/App.xcarchive
          fi
    artifacts:
      - ios/App/build/App.xcarchive
      - ios/App/build/**/*.app
      - /tmp/xcodebuild_logs/*.log
