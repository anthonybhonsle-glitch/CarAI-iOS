workflows:
  ios-workflow:
    name: CarAI iOS App
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Apple App Store Key
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Setup Node 22 & Install dependencies
        script: |
          set -e
          if command -v nvm &> /dev/null; then
            nvm install 22 || true
            nvm use 22 || true
          fi
          echo "Active Node Version: $(node -v)"
          npm install --legacy-peer-deps
      - name: Build Web App
        script: |
          set -e
          npm run build
      - name: Sync iOS Native Project
        script: |
          set -e
          npx --yes @capacitor/cli sync ios
      - name: Initialize keychain and fetch Apple signing certificates
        script: |
          keychain initialize || true
          app-store-connect fetch-signing-files "com.carai.mechanicpro" \
            --type IOS_APP_STORE \
            --create || true
          xcode-project use-profiles || true
      - name: Build iOS Application
        script: |
          set -e
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App || true
          cd ../..
          if xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App; then
            echo "App Store signed IPA created successfully!"
          else
            echo "Falling back to release archive IPA..."
            cd ios/App
            xcodebuild archive \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -archivePath build/App.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
            mkdir -p build/Payload
            cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
            cd build
            zip -qr App.ipa Payload
            rm -rf Payload
            cd ../..
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/App.ipa
      - ios/App/build/App.xcarchive
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
