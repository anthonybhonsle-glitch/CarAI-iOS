workflows:
  ios-workflow:
    name: CarAI iOS App
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build Web App
        script: |
          npm run build
      - name: Sync iOS Native Project
        script: |
          npx cap sync ios
      - name: Build iOS Application
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            archive -archivePath build/App.xcarchive
    artifacts:
      - ios/App/build/App.xcarchive
      - ios/App/build/**/*.app
      - /tmp/xcodebuild_logs/*.log
