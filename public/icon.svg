<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Carbon fiber pattern -->
    <pattern id="carbonPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#0C1017"/>
      <rect width="8" height="8" fill="#141B26"/>
      <rect x="8" y="8" width="8" height="8" fill="#141B26"/>
      <path d="M0,8 L8,0 M8,16 L16,8" stroke="#1A2433" stroke-width="1.2"/>
    </pattern>

    <!-- Glowing Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="wrenchShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.8"/>
    </filter>

    <!-- Engine Light Gradient -->
    <linearGradient id="engineNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00A3FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>

    <!-- Pulse Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="40%" stop-color="#FFDD00"/>
      <stop offset="65%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- Chrome Wrench Gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#D1D5DB"/>
      <stop offset="50%" stop-color="#9CA3AF"/>
      <stop offset="75%" stop-color="#4B5563"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>

    <!-- OBD Plug Gradient -->
    <linearGradient id="obdPlug" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="100%" stop-color="#1A202C"/>
    </linearGradient>
  </defs>

  <!-- Background Base with Carbon Texture -->
  <rect width="512" height="512" rx="108" fill="#0A0E14"/>
  <rect width="512" height="512" rx="108" fill="url(#carbonPattern)"/>
  
  <!-- Outer Tech Border Rim -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#223247" stroke-width="4"/>

  <!-- Subtle Cyan Ambient Radial Glow Behind Engine -->
  <circle cx="256" cy="220" r="140" fill="#00D2FF" opacity="0.12" filter="blur(30px)"/>

  <!-- CHECK ENGINE LIGHT OUTLINE (Glowing Cyan) -->
  <g filter="url(#neonGlow)">
    <path d="M 170 120 
             L 190 120 
             L 190 150 
             L 322 150 
             L 322 120 
             L 342 120 
             L 342 170 
             L 380 170 
             L 380 200 
             L 395 200 
             L 395 270 
             L 380 270 
             L 380 300 
             L 350 300 
             L 340 330 
             L 172 330 
             L 162 300 
             L 132 300 
             L 132 270 
             L 117 270 
             L 117 200 
             L 132 200 
             L 132 170 
             L 170 170 
             Z" 
          fill="none" 
          stroke="url(#engineNeon)" 
          stroke-width="14" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>

    <!-- Engine Inner Body Cutouts -->
    <path d="M 180 180 L 332 180 L 332 290 L 180 290 Z" 
          fill="#060C14" 
          opacity="0.6"/>

    <!-- VIBRANT DIAGNOSTIC PULSE WAVE (Center Lifeline) -->
    <path d="M 140 236 
             L 190 236 
             L 208 195 
             L 228 280 
             L 250 170 
             L 272 270 
             L 290 215 
             L 306 236 
             L 372 236" 
          fill="none" 
          stroke="url(#pulseGrad)" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- 16-PIN OBD-II CONNECTOR PLUG (Bottom) -->
  <g filter="url(#wrenchShadow)">
    <!-- Plug housing (trapezoid) -->
    <path d="M 200 370 
             L 312 370 
             L 326 420 
             L 186 420 
             Z" 
          fill="url(#obdPlug)" 
          stroke="#4A5568" 
          stroke-width="5" 
          stroke-linejoin="round"/>
    
    <!-- Ribbed grip ridges -->
    <line x1="216" y1="380" x2="296" y2="380" stroke="#718096" stroke-width="3" stroke-linecap="round"/>
    <line x1="212" y1="392" x2="300" y2="392" stroke="#718096" stroke-width="3" stroke-linecap="round"/>
    <line x1="206" y1="404" x2="306" y2="404" stroke="#718096" stroke-width="3" stroke-linecap="round"/>

    <!-- 16-Pin grid ports (Golden glow pins) -->
    <!-- Top row 8 pins -->
    <g fill="#F6E05E">
      <rect x="210" y="386" width="6" height="4" rx="1"/>
      <rect x="222" y="386" width="6" height="4" rx="1"/>
      <rect x="234" y="386" width="6" height="4" rx="1"/>
      <rect x="246" y="386" width="6" height="4" rx="1"/>
      <rect x="258" y="386" width="6" height="4" rx="1"/>
      <rect x="270" y="386" width="6" height="4" rx="1"/>
      <rect x="282" y="386" width="6" height="4" rx="1"/>
      <rect x="294" y="386" width="6" height="4" rx="1"/>
    <!-- Bottom row 8 pins -->
      <rect x="206" y="398" width="6" height="4" rx="1"/>
      <rect x="218" y="398" width="6" height="4" rx="1"/>
      <rect x="230" y="398" width="6" height="4" rx="1"/>
      <rect x="242" y="398" width="6" height="4" rx="1"/>
      <rect x="254" y="398" width="6" height="4" rx="1"/>
      <rect x="266" y="398" width="6" height="4" rx="1"/>
      <rect x="278" y="398" width="6" height="4" rx="1"/>
      <rect x="290" y="398" width="6" height="4" rx="1"/>
    </g>

    <!-- Cable lead heading down -->
    <path d="M 240 422 L 240 450 C 240 460 272 460 272 450 L 272 422 Z" fill="#1A202C" stroke="#2D3748" stroke-width="4"/>
  </g>

  <!-- CHROME MECHANIC WRENCH (Angled across lower right) -->
  <g filter="url(#wrenchShadow)" transform="rotate(-32 340 310)">
    <!-- Wrench shaft -->
    <rect x="250" y="295" width="140" height="26" rx="8" fill="url(#chromeGrad)" stroke="#E5E7EB" stroke-width="2.5"/>
    
    <!-- Open-end wrench head -->
    <path d="M 380 278 
             C 410 278 424 292 424 308 
             C 424 324 410 338 380 338 
             C 365 338 356 330 350 322 
             L 375 308 
             L 350 294 
             C 356 286 365 278 380 278 Z" 
          fill="url(#chromeGrad)" 
          stroke="#FFFFFF" 
          stroke-width="3"/>
          
    <!-- Metallic reflection highlight -->
    <line x1="265" y1="302" x2="360" y2="302" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
